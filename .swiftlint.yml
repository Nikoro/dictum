included:
  - .

excluded:
  - .agents
  - .tools
  - scripts
  - .claude
  - .git
  - .github
  - .vscode
  - build
  - Dictum.xcodeproj
  - website

reporter: xcode

analyzer_rules:
  - unused_import

# Explicit rule list, so a SwiftLint upgrade cannot change results by enabling new defaults.
# closure_body_length is what bounds SwiftUI `body`: function_body_length ignores computed
# properties.
only_rules:
  - accessibility_trait_for_button
  - async_without_await
  - attribute_name_spacing
  - blanket_disable_command
  - block_based_kvo
  - class_delegate_protocol
  - closing_brace
  - closure_body_length
  - closure_parameter_position
  - colon
  - comma
  - comment_spacing
  - compiler_protocol_init
  - computed_accessors_order
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - control_statement
  - custom_rules
  - cyclomatic_complexity
  - deployment_target
  - discarded_notification_center_observer
  - discouraged_direct_init
  - discouraged_optional_boolean
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - fatal_error_message
  - file_length
  - first_where
  - for_where
  - force_cast
  - force_try
  - force_unwrapping
  - function_body_length
  - function_name_whitespace
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - implicit_getter
  - implicit_optional_initialization
  - implicitly_unwrapped_optional
  - inclusive_language
  - invalid_swiftlint_command
  - invisible_character
  - is_disjoint
  - large_tuple
  - last_where
  - leading_whitespace
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_nsgeometry_functions
  - legacy_random
  - legacy_swiftui_aspect_ratio
  - line_length
  - mark
  - modifier_order
  - multiline_arguments
  - multiple_closures_with_trailing_closure
  - nesting
  - no_fallthrough_only
  - no_space_in_method_call
  - non_optional_string_data_conversion
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal
  - opening_brace
  - optional_data_string_conversion
  - orphaned_doc_comment
  - prefer_type_checking
  - private_over_fileprivate
  - private_subject
  - private_swiftui_state
  - private_unit_test
  - protocol_property_accessors_order
  - reduce_boolean
  - reduce_into
  - redundant_discardable_let
  - redundant_objc_attribute
  - redundant_sendable
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - self_in_property_initialization
  - shorthand_operator
  - sorted_first_last
  - statement_position
  - static_over_final_class
  - superfluous_disable_command
  - switch_case_alignment
  - syntactic_sugar
  - todo
  - toggle_bool
  - trailing_closure
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length
  - type_name
  - unavailable_condition
  - unneeded_break_in_switch
  - unneeded_override
  - unneeded_synthesized_initializer
  - unowned_variable_capture
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_setter_value
  - valid_ibinspectable
  - vertical_parameter_alignment
  - vertical_whitespace
  - void_function_in_ternary
  - void_return
  - weak_delegate
  - xctfail_message

cyclomatic_complexity:
  warning: 8
  error: 12
  ignores_case_statements: true

file_length:
  warning: 250
  error: 350
  ignore_comment_only_lines: true

function_body_length:
  warning: 30
  error: 50

closure_body_length:
  warning: 25
  error: 40

type_body_length:
  warning: 200
  error: 300

line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

identifier_name:
  excluded:
    - id
    - pl
    - en
    - de
    - fr
    - es
    - it
    - pt
    - uk
    - cs
    - nl
    - ja
    - ko
    - zh
    - ru
    - sv
    - tr

function_parameter_count:
  warning: 5
  error: 8

large_tuple:
  warning: 3
  error: 4

todo:
  severity: warning

# SwiftFormat's wrapMultilineStatementBraces moves `{` onto its own line after a wrapped
# header; accept that layout instead of fighting the formatter.
opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_type_headers: true
  ignore_multiline_function_signatures: true

trailing_whitespace:
  ignores_empty_lines: true

vertical_whitespace:
  max_empty_lines: 1

# Matches SwiftFormat's modifierOrder (access level before `nonisolated`), so the two agree.
modifier_order:
  preferred_modifier_order:
    - override
    - acl
    - setterACL
    - isolation
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

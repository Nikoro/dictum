name: Dictum
options:
  bundleIdPrefix: com.dominikkrajcer
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "26111401"

packages:
  # WhisperKit graduated into the Argmax OSS SDK at 1.0.0; the repo was renamed and the
  # package no longer depends on swift-transformers (Hub/Tokenizers are vendored internally).
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 3.32.3
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.3.5
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 1.0.0
  # Parakeet speech recognition on the Neural Engine (the "fast" engine).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.0
  # A bump must also update SPARKLE_VERSION and SPARKLE_SHA256 in .github/workflows/release.yml.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.10.1"

targets:
  Dictum:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominikkrajcer.dictum
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: macOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Resources/Dictum.entitlements
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "Y5T33B6749"
        CODE_SIGN_STYLE: "Manual"
        PRODUCT_NAME: Dictum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
      - package: swift-huggingface
        product: HuggingFace
      - package: Sparkle
      - package: FluidAudio
        product: FluidAudio
    postBuildScripts:
      - name: Sign Sparkle helpers
        script: scripts/signing/sign_sparkle_helpers.sh
        basedOnDependencyAnalysis: false
    entitlements:
      path: macOS/Resources/Dictum.entitlements
      properties:
        com.apple.security.device.audio-input: true
    scheme:
      testTargets:
        - DictumTests

  DictumTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DictumTests
        excludes:
          - iOS
          - iOSUI
    dependencies:
      - target: Dictum
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "Y5T33B6749"
        CODE_SIGN_STYLE: "Manual"

  DictumIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iOS/App
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominikkrajcer.dictum
        PRODUCT_NAME: Dictum
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: Y5T33B6749
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iOS/Resources/Dictum.entitlements
        INFOPLIST_FILE: iOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - target: DictumKeyboard
        embed: true
    scheme:
      testTargets:
        - DictumIOSTests
        - DictumIOSUITests

  DictumKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iOS/Keyboard
      - path: Shared
      - path: Resources/Localizable.xcstrings
      - path: Resources/Assets.xcassets
      - path: Resources/Licenses
      - path: Resources/Emoji
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominikkrajcer.dictum.keyboard
        PRODUCT_NAME: DictumKeyboard
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: Y5T33B6749
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iOS/Resources/Dictum.entitlements
        INFOPLIST_FILE: iOS/Resources/Keyboard-Info.plist
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: iOS/Keyboard/HostRuntime.h
        SKIP_INSTALL: "YES"

  DictumIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DictumTests/iOS
    dependencies:
      - target: DictumIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dictum.app/Dictum"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: Y5T33B6749
        CODE_SIGN_STYLE: Automatic

  DictumIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DictumTests/iOSUI
    dependencies:
      - target: DictumIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: Y5T33B6749
        CODE_SIGN_STYLE: Automatic

  DictumKeyboardPreview:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: iOS/Preview
      - path: iOS/Keyboard
        excludes:
          - KeyboardViewController.swift
          - KeyboardHostResolver.swift
          - HostRuntime.h
          - HostRuntime.m
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominikkrajcer.dictum.keyboardpreview
        PRODUCT_NAME: DictumKeyboardPreview
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        SUPPORTED_PLATFORMS: iphonesimulator
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_FILE: iOS/Preview/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

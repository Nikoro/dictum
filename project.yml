name: Dictum
options:
  bundleIdPrefix: com.dominikkrajcer
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  minimumXcodeGenVersion: "2.38.0"

packages:
  # WhisperKit graduated into the Argmax OSS SDK at 1.0.0; the repo was renamed and the
  # package no longer depends on swift-transformers (Hub/Tokenizers are vendored internally).
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: 3.32.3
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: 1.3.5
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 1.0.0
  # Parakeet speech recognition on the Neural Engine (the "fast" engine).
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.18.0
  # A bump must also update SPARKLE_VERSION and SPARKLE_SHA256 in .github/workflows/release.yml.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.10.1"

targets:
  Dictum:
    type: application
    platform: macOS
    sources:
      - path: DictumLogger.swift
      - path: DictationPipeline.swift
      - path: DictationProcessor.swift
      - path: DictumApp.swift
      - path: Audio
      - path: Context
      - path: FloatingIndicator
      - path: HotkeyAndPaste
      - path: MenuBar
      - path: ModelBrowser
      - path: Resources
      - path: Settings
      - path: TextProcessing
      - path: Transcription
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dominikkrajcer.dictum
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Dictum.entitlements
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "Y5T33B6749"
        CODE_SIGN_STYLE: "Manual"
        PRODUCT_NAME: Dictum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
      - package: swift-huggingface
        product: HuggingFace
      - package: Sparkle
      - package: FluidAudio
        product: FluidAudio
    postBuildScripts:
      - name: Sign Sparkle helpers
        script: scripts/signing/sign_sparkle_helpers.sh
        basedOnDependencyAnalysis: false
    entitlements:
      path: Resources/Dictum.entitlements
      properties:
        com.apple.security.device.audio-input: true
